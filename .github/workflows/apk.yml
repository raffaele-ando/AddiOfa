name: APK Android
# Costruisce l'APK di prova (firmato con la chiave di debug, installabile a mano). Si lancia da GitHub: Actions → «APK Android» → Run workflow.
# Scarica il file dalla sezione «Artifacts» della esecuzione. Facoltativo: l'indirizzo del server ATLAS (senza barra finale).
on:
  workflow_dispatch:
    inputs:
      atlas_url:
        description: "Indirizzo del Worker ATLAS (es. https://atlas.nome.workers.dev), vuoto = non collegato"
        required: false
        default: ""
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Costruisci il sito e sincronizza Android
        working-directory: app
        env:
          VITE_ATLAS_API_URL: ${{ inputs.atlas_url }}
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Costruisci l'APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AddiOFA-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
