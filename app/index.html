<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1D4ED8" />
    <title>AddiOFA – Preparazione OFA di Inglese</title>
    <meta name="description" content="Allenati all'OFA di Inglese con ripasso dilazionato e simulazioni da 30 domande in 15 minuti. Progetto studentesco indipendente, non affiliato al Politecnico di Milano." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./favicon-64.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      (function () {
        var scuro = false;
        try {
          var t = localStorage.getItem('theme');
          scuro = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        document.documentElement.classList.toggle('dark', scuro);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
