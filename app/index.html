<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A101F" media="(prefers-color-scheme: dark)" />
    <title>AddiOFA – Preparazione OFA di Inglese</title>
    <meta name="description" content="Allenati all'OFA di Inglese con ripasso dilazionato e simulazioni da 30 domande in 15 minuti. Progetto studentesco indipendente, non affiliato al Politecnico di Milano." />
    <link rel="canonical" href="https://addiofa.theproject.world/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="AddiOFA" />
    <meta property="og:title" content="AddiOFA – Preparazione OFA di Inglese" />
    <meta property="og:description" content="Scopri a che punto sei con l'OFA di inglese: test di livello, ripasso dei tuoi errori e simulazioni da 30 domande. Gratuito." />
    <meta property="og:url" content="https://addiofa.theproject.world/" />
    <meta property="og:image" content="https://addiofa.theproject.world/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./favicon-64.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      (function () {
        var scuro = false;
        try {
          var t = localStorage.getItem('theme');
          scuro = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        document.documentElement.classList.toggle('dark', scuro);
      })();
      // Indirizzo inesistente (es. /pagina/che/non/esiste): l'host rimanda questa pagina ma i file con percorso relativo (./assets/…)
      // non si trovano e la pagina resterebbe bianca. Se un file della pagina non si carica, si torna una volta alla Home del sito.
      (function () {
        var CHIAVE = 'addiofa_ritorno_home';
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          try { if (sessionStorage.getItem(CHIAVE)) return; sessionStorage.setItem(CHIAVE, '1'); } catch (x) { return; }
          location.replace('/' + location.search);
        }, true);
        window.addEventListener('load', function () { try { sessionStorage.removeItem(CHIAVE); } catch (x) {} });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
