  <path id="bandiera-alone" data-fisso="1" data-maglia="no" d="M89 37 L157 29.9 L158 78 L90 85 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" filter="url(#sfuma-bordo)"/>
