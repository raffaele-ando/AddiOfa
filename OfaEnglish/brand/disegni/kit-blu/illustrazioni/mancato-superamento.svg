  <!-- documento -->
  <g id="documento">
    <path id="foglio" d="M31 9.5 H89 Q92 9.5 94 11.5 L106.5 24 Q109.5 26 109.5 29 V107.5 Q109 115 101 115 H30 Q21.5 115 21.5 107 V18 Q21.5 9.5 31 9.5 Z" fill="url(#azzurro-foglio)"/>
