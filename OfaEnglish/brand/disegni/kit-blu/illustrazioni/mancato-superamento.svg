<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 149 122" width="149" height="122">
  <title>Mancato superamento</title>
  <defs>
    <filter id="sfuma-alone" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.6"/></filter>
    <linearGradient id="azzurro-foglio" gradientUnits="userSpaceOnUse" x1="90.06" y1="9.21" x2="41.32" y2="110.63">
      <stop offset="0" stop-color="#DBE6FE"/><stop offset="0.994" stop-color="#E3EBFE"/>
    </linearGradient>
    <linearGradient id="rosso-bollino" gradientUnits="userSpaceOnUse" x1="98.46" y1="63.75" x2="121.15" y2="115.92">
      <stop offset="0.012" stop-color="#FB6364"/><stop offset="0.977" stop-color="#F02327"/>
