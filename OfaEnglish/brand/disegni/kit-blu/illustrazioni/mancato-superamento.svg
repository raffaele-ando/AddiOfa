    <circle id="nuvola-sinistra" cx="29.75" cy="86.11" r="26.57"/>
    <ellipse id="nuvola-destra" cx="117.72" cy="68.37" rx="28.45" ry="41.05"/>
    <ellipse id="nuvola-basso" cx="74.25" cy="103.86" rx="58.13" ry="14.75"/>
