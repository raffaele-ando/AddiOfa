<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 159" width="202" height="159">
  <title>Piano di studi bloccato</title>
  <defs>
    <filter id="sfuma-alone" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.5"/></filter>
    <linearGradient id="blu-testata" gradientUnits="userSpaceOnUse" x1="0.16" y1="40.09" x2="1.11" y2="67.24">
      <stop offset="0" stop-color="#5592FC"/><stop offset="0.97" stop-color="#4687FC"/>
    </linearGradient>
    <linearGradient id="blu-anello" gradientUnits="userSpaceOnUse" x1="0.47" y1="25.11" x2="-0.09" y2="59.9">
      <stop offset="0" stop-color="#1A6AF0"/><stop offset="1" stop-color="#0B58F7"/>
    </linearGradient>
    <linearGradient id="azzurro-casella" gradientUnits="userSpaceOnUse" x1="53.52" y1="59.66" x2="148" y2="139.24">
      <stop offset="0" stop-color="#D1E0FD"/><stop offset="1" stop-color="#C4D5FD"/>
    </linearGradient>
    <linearGradient id="rosso-lucchetto" gradientUnits="userSpaceOnUse" x1="122.67" y1="105.06" x2="179.13" y2="149">
      <stop offset="0.016" stop-color="#FD6C6C"/><stop offset="0.923" stop-color="#ED282D"/>
    </linearGradient>
    <linearGradient id="rosso-arco" gradientUnits="userSpaceOnUse" x1="147.85" y1="77.23" x2="170.88" y2="106.86">
      <stop offset="0.184" stop-color="#FB6C66"/><stop offset="0.96" stop-color="#F75356"/>
    </linearGradient>
  </defs>

  <!-- sfondo: nuvola chiara -->
  <g id="nuvola" fill="#F0F4FE" filter="url(#sfuma-alone)">
    <circle id="nuvola-alto" cx="92.83" cy="75.87" r="73.37"/>
    <ellipse id="nuvola-destra" cx="150.37" cy="88.06" rx="47.92" ry="58.01"/>
    <rect id="nuvola-basso" x="21.89" y="83.53" width="160.44" height="70.28" rx="11.93"/>
    <ellipse id="nuvola-sinistra" cx="38.41" cy="112.55" rx="33.31" ry="41.32"/>
  </g>

  <!-- calendario -->
  <g id="calendario">
    <rect id="calendario-foglio" x="36.3" y="57" width="129.2" height="96" rx="9" fill="#F3F6FE"/>
    <path id="calendario-testata" d="M45.5 43.5 H156 Q165.5 43.5 165.5 53 V66.2 H36.3 V53 Q36.3 43.5 45.5 43.5 Z" fill="url(#blu-testata)"/>
    <rect id="anello-sinistro" x="58.18" y="33.29" width="10.34" height="24.95" rx="5.1" fill="url(#blu-anello)"/>
    <rect id="anello-destro" x="134.25" y="32" width="10.14" height="24.87" rx="4.74" fill="url(#blu-anello)"/>
    <g id="caselle" fill="url(#azzurro-casella)">
      <rect id="casella-1" x="56.61" y="81.56" width="20.97" height="21.77" rx="4.35"/>
      <rect id="casella-2" x="91.73" y="81.32" width="20.4" height="22.03" rx="3.91"/>
      <rect id="casella-3" x="125.29" y="80.74" width="22.42" height="21.88" rx="4.14"/>
      <rect id="casella-4" x="57.29" y="115.29" width="20.61" height="21.85" rx="3.43"/>
      <rect id="casella-5" x="91.77" y="115.3" width="20.41" height="20.87" rx="3.24"/>
      <rect id="casella-6" x="124.62" y="114.46" width="20" height="22.71" rx="4.32"/>
    </g>
  </g>

  <!-- lucchetto -->
  <g id="lucchetto">
    <path id="lucchetto-alone" d="M137.5 104 V94 A19 19 0 0 1 175.5 94 V102 H177 Q183.5 102 183.5 108.5 V149 Q183.5 155 177 155 H136 Q129.5 155 129.5 149 V108.5 Q129.5 102 136 102 Z" fill="#EFF0F9"/>
    <path id="lucchetto-arco" d="M139.5 105 V94 A17.29 17.2 -0.22 0 1 174.07 94 V105 H165.71 V94.36 A9.09 8.98 -1.04 0 0 147.38 95.18 V105.36 Z" fill="url(#rosso-arco)"/>
    <rect id="lucchetto-corpo" x="130.49" y="104.43" width="51.27" height="49" rx="7.08" fill="url(#rosso-lucchetto)"/>
    <path id="serratura" d="M155.8 116 A6.2 6 0 0 1 159.1 127 L159.6 138.6 Q159.6 140.2 158 140.2 H153.6 Q152 140.2 152 138.6 L152.5 127 A6.2 6 0 0 1 155.8 116 Z" fill="#FEF9FA"/>
  </g>
</svg>
